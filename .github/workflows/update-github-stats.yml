name: Update GitHub stats SVGs

on:
  schedule:
    - cron: '34 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cards from GitHub GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sarahaliriel
        run: python scripts/update_github_stats.py
      - name: Commit SVGs if changed
        run: |
          git add public/github-overview.svg public/github-streak.svg public/github-activity.svg
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh GitHub stats SVGs'
          git push
