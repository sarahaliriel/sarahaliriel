name: Update Discord community card

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update SVG from Discord public APIs
        run: python scripts/update_discord_card.py
      - name: Commit updated card (only when changed)
        run: |
          if git diff --quiet -- assets/community-card.svg; then
            echo 'No changes to community card.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/community-card.svg
          git commit -m 'chore: refresh Discord community stats'
          git push
